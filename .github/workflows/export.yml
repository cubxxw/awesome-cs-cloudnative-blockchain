name: Export issues
on:
  schedule:
    # run every 8 hours
    - cron: '0 0,8,16 * * *'
  pull_request:
    paths:
      - '.github/workflows/export.yml'
      - '.github/scripts/export_issues.py'
      - '.github/scripts/test_export_issues.py'

permissions:
  contents: read
  issues: read

jobs:
  test:
    name: Verify offline issue export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  deploy:
    name: Export issues to workflow artifact
    if: github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export issues and comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/export_issues.py
      - name: Archive issue documents
        uses: actions/upload-artifact@v4
        with:
          name: issues
          path: 'issues/*.md'
