name: Release Drafter

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  update_release_draft:
    # The action reads its configuration from the default branch.
    # Release notes describe changes that have already landed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          publish: 'false'
          disable-autolabeler: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
